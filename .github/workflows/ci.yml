name: CI

# Every pull request and every push to main runs the whole suite.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Typecheck, unit/API tests, build, browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and API tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install the test browser
        run: npx playwright install --with-deps chromium

      - name: Browser tests (desktop, phone, PIN lock)
        run: npx playwright test

      - name: Keep the browser test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  docker:
    name: Docker image builds, starts healthy, keeps its data
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t minibald:ci .

      - name: Start it as a normal user on a bind-mounted data folder
        run: |
          mkdir -p "$RUNNER_TEMP/data"
          sudo chown 1000:1000 "$RUNNER_TEMP/data"
          docker run -d --name minibald --user 1000:1000 -p 8080:8080 -e TZ=Europe/Rome -v "$RUNNER_TEMP/data:/data" minibald:ci
          for i in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' minibald)
            [ "$status" = healthy ] && break
            sleep 2
          done
          docker inspect --format 'health: {{.State.Health.Status}}' minibald
          test "$(docker inspect --format '{{.State.Health.Status}}' minibald)" = healthy

      - name: Use it, restart it, check the data survived
        run: |
          curl -fsS localhost:8080/api/health
          curl -fsS -X POST localhost:8080/api/miniatures -H 'content-type: application/json' -d '{"name":"Survives a restart"}'
          curl -fsS localhost:8080/ | grep -q '<div id="root">'
          docker restart minibald
          for i in $(seq 1 30); do curl -fsS localhost:8080/api/health >/dev/null 2>&1 && break; sleep 2; done
          curl -fsS localhost:8080/api/miniatures | grep -q 'Survives a restart'
          test -f "$RUNNER_TEMP/data/minis.db"
          test -d "$RUNNER_TEMP/data/photos"

      - name: Container logs
        if: always()
        run: docker logs minibald || true
